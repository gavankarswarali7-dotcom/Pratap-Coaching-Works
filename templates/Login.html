<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Pratap Coaching Works</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a237e;
            color: #fff;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 380px;
            padding: 36px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card h2 {
            color: #1a237e;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .card p.sub {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #1a237e; }
        button {
            width: 100%;
            background: #1a237e;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #ff6f00; }
        .error {
            background: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c2c0;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1a237e;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back:hover { color: #ff6f00; }
        footer {
            background: #0d1547;
            text-align: center;
            padding: 16px;
            color: #7986cb;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="header">PRATAP COACHING WORKS</div>

<div class="wrap">
    <form class="card" method="POST" action="{{ url_for('login') }}">
        <h2>Admin Login</h2>
        <p class="sub">Enter your username and password to open the admin panel.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">LOGIN</button>

        <a class="back" href="{{ url_for('home') }}">← Back to Website</a>
    </form>
</div>

<footer>© 2026 Pratap Coaching Works, Miraj</footer>

</body>
</html>
